{% extends "base.html" %}

{% block title %}{{ title|default:"Confirm Action" }} | Cheremo Egg Depot{% endblock %}
{% block page_title %}{{ title|default:"Confirm Action" }}{% endblock %}

{% block content %}
<div style="max-width:550px; margin:2rem auto;">
  <div class="card" style="border-top:4px solid var(--color-error);">
    <div class="card-header-clean">
      <h3 class="card-title-clean" style="color:var(--color-error);">⚠️ {{ title }}</h3>
    </div>

    <p style="font-size:0.95rem; margin-bottom:1.5rem; line-height:1.5;">
      {{ message }}
    </p>

    <form method="post">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="reason" class="form-label">Reason for cancellation / note:</label>
        <input type="text" name="reason" id="reason" class="form-control" placeholder="e.g. Customer returned items, entered incorrect quantity" required>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
        <a href="{% url back_url|default:'sales' %}" class="btn btn-secondary">Go Back</a>
        <button type="submit" class="btn btn-danger">
          {{ action_name|default:"Confirm" }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
